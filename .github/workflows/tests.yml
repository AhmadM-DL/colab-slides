name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-impress poppler-utils > /dev/null
      - name: Install package
        run: pip install . pytest python-pptx
      - run: pytest -q

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-slides"
version = "0.1.0"
description = "Render PowerPoint and Google Slides decks inside Google Colab / Jupyter from a link"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["ipython", "requests"]

[tool.setuptools]
packages = ["colab_slides"]

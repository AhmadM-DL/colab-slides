[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-slides"
version = "0.1.1"
description = "Render PowerPoint and Google Slides decks inside Google Colab or Jupyter from a link"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Mustapha" }]
keywords = ["colab", "google-colab", "jupyter", "ipython", "magic", "powerpoint", "pptx",
            "google-slides", "slides", "presentation", "slideshow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Education",
]
dependencies = ["ipython", "requests"]

[project.urls]
Homepage = "https://github.com/AhmadM-DL/colab-slides"
Repository = "https://github.com/AhmadM-DL/colab-slides"
Issues = "https://github.com/AhmadM-DL/colab-slides/issues"

[tool.setuptools]
packages = ["colab_slides"]
